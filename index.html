<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Life — 24/7 autonomous world</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}button{border:1px solid #ffffff2b;background:#101a16dd;color:#fff;border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer}button:hover{background:#1a2822}.panel{position:fixed;z-index:5;border:1px solid #ffffff20;background:#07130dcc;backdrop-filter:blur(10px);border-radius:14px}.top{left:12px;top:12px;padding:12px 14px}.top h1{font-size:20px;margin:0 0 2px}.clock{font-size:25px;font-weight:900;letter-spacing:.5px}.sub,.hint{opacity:.7;font-size:12px}.right{right:12px;top:12px;width:295px;max-height:64vh;overflow:auto;padding:12px}.title{font-weight:900;margin-bottom:7px}.stat{font-size:12px;margin:5px 0}.log{font-size:12px;line-height:1.35;margin:6px 0;padding:7px;border-radius:9px;background:#ffffff0b}.bottom{left:12px;right:12px;bottom:12px;display:flex;gap:7px;padding:8px;overflow-x:auto}.bubble{position:fixed;z-index:4;transform:translate(-50%,-100%);max-width:210px;padding:7px 10px;border-radius:12px;background:#fff;color:#111;font-size:12px;font-weight:700;box-shadow:0 5px 20px #0008;pointer-events:none;display:none}.name{position:fixed;z-index:4;transform:translate(-50%,-50%);font-size:12px;font-weight:900;text-shadow:0 2px 5px #000;pointer-events:none}.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:.8px}.dot{width:8px;height:8px;border-radius:50%;background:#ff4b4b;box-shadow:0 0 10px #ff4b4b}.mode{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:5;background:#07130dcc;border:1px solid #ffffff20;border-radius:12px;padding:7px 12px;font-size:12px;font-weight:800;backdrop-filter:blur(10px)}
@media(max-width:700px){.top{left:8px;right:8px;top:8px}.right{left:8px;right:8px;top:auto;bottom:76px;width:auto;max-height:30vh}.bottom{left:8px;right:8px;bottom:8px}.mode{top:8px}.top h1{font-size:17px}.clock{font-size:21px}button{min-height:44px}}
</style></head>
<body>
<div id="game"></div>
<div class="panel top"><h1>🌍 AI LIFE</h1><div class="live"><span class="dot"></span> LIVE · АВТОНОМНЫЙ МИР</div><div class="clock" id="clock">--:--:--</div><div class="sub" id="day">День 1 · первый день</div></div>
<div class="mode">👁 Мы только наблюдаем · 1 сек = 1 сек</div>
<div class="panel right"><div class="title">🧠 Жизнь мира</div><div id="stats"></div><div class="title" style="margin-top:10px">🌲 Ресурсы</div><div id="worldStats" class="stat"></div><div class="title" style="margin-top:10px">💬 Последние события</div><div id="log">Мир только начинается.</div><div class="hint">Свайп — камера · два пальца — масштаб</div></div>
<div class="bottom"><button id="pause">⏸ Пауза</button><button id="fa">👤 Альфа</button><button id="fb">👤 Бета</button><button id="free">🎥 Свободно</button><button id="auto">🎬 Автокамера</button><button id="new">🌱 Новый мир</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x08140d);scene.fog=new THREE.Fog(0x08140d,55,125);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,220);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.querySelector('#game').append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfe5ff,0x294026,2.1));const sun=new THREE.DirectionalLight(0xfff1c9,2.4);sun.position.set(25,45,15);scene.add(sun);
const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(130,130),new THREE.MeshStandardMaterial({color:0x315a3b,roughness:1}));ground.rotation.x=-Math.PI/2;world.add(ground);
const water=new THREE.Mesh(new THREE.CircleGeometry(15,48),new THREE.MeshStandardMaterial({color:0x236b86,transparent:true,opacity:.84,roughness:.3}));water.rotation.x=-Math.PI/2;water.position.set(-27,.03,-21);world.add(water);
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const resources=[];const buildings=[];const agents=[];const logs=[];let relation=42,paused=false,follow=null,auto=true,camYaw=.65,camPitch=.55,camRad=34,autoTarget=null,autoTimer=0;
function makeTree(x,z){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.24,.34,2.4,8),new THREE.MeshStandardMaterial({color:0x654323}));const crown=new THREE.Mesh(new THREE.ConeGeometry(1.35,3,9),new THREE.MeshStandardMaterial({color:0x22653a}));trunk.position.y=1.2;crown.position.y=2.9;g.add(trunk,crown);g.position.set(x,0,z);world.add(g);resources.push({type:'wood',amount:3,max:3,mesh:g,pos:g.position.clone(),busy:0});}
function makeRock(x,z){const g=new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(.45,.85)),new THREE.MeshStandardMaterial({color:0x77766e,roughness:1}));g.position.set(x,.55,z);world.add(g);resources.push({type:'stone',amount:3,max:3,mesh:g,pos:g.position.clone(),busy:0});}
for(let i=0;i<52;i++){let x=rnd(-52,52),z=rnd(-52,52);if(Math.hypot(x+27,z+21)>18)makeTree(x,z)}for(let i=0;i<32;i++)makeRock(rnd(-52,52),rnd(-52,52));
function human(name,skin,shirt,x,z){const q=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.05,6,12),new THREE.MeshStandardMaterial({color:shirt}));const head=new THREE.Mesh(new THREE.SphereGeometry(.52,16,12),new THREE.MeshStandardMaterial({color:skin}));const legs=new THREE.Group();for(const sx of [-.18,.18]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.62,5,8),new THREE.MeshStandardMaterial({color:shirt}));leg.position.set(sx,-.52,0);legs.add(leg)}body.position.y=.82;head.position.y=1.95;q.add(body,head,legs);q.position.set(x,0,z);scene.add(q);const ring=new THREE.Mesh(new THREE.RingGeometry(.72,.92,32),new THREE.MeshBasicMaterial({color:shirt,transparent:true,opacity:.9,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;ring.visible=false;q.add(ring);const ne=document.createElement('div'),be=document.createElement('div');ne.className='name';be.className='bubble';ne.textContent=name;document.body.append(ne,be);const a={name,q,ring,en:100,hu:15,kn:0,tech:0,wood:0,stone:0,food:1,state:'просыпается',target:new THREE.Vector3(rnd(-45,45),0,rnd(-45,45)),memory:[],bubble:'',talk:0,build:0,carry:null,ne,be,skin,shirt};agents.push(a);return a}
const alpha=human('Альфа',0xe4b28f,0x5fc9ef,-7,5),beta=human('Бета',0xd69a78,0xff9d68,8,-3);
function log(text){logs.unshift({t:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),text});if(logs.length>12)logs.pop()}
const phrases=[['Привет.','Привет. Я только начинаю исследовать.'],['Ты видел воду рядом?','Да. Я запомню это место.'],['Я собираю дерево.','Тогда я попробую найти камень.'],['Нам нужно место для ночлега.','Давай сначала соберём материалы.'],['Я думаю, здесь можно построить убежище.','Согласен.']];
function speak(text){if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.9;speechSynthesis.speak(u)}}
function talk(a,b){if(a.talk>0||b.talk>0)return;a.talk=b.talk=7;a.ring.visible=b.ring.visible=true;const p=phrases[Math.floor(Math.random()*phrases.length)];relation=clamp(relation+1,0,100);a.memory.unshift({with:b.name,text:p[0],time:new Date().toLocaleTimeString('ru-RU')});b.memory.unshift({with:a.name,text:p[1],time:new Date().toLocaleTimeString('ru-RU')});a.memory=a.memory.slice(0,12);b.memory=b.memory.slice(0,12);a.bubble=p[0];b.bubble=p[1];log(`${a.name}: «${p[0]}» · ${b.name}: «${p[1]}»`);speak(p[0]);setTimeout(()=>speak(p[1]),1600)}
function nearestResource(a,type){let best=null,bd=Infinity;for(const r of resources){if(r.type!==type||r.amount<=0||r.busy>0)continue;const d=a.q.position.distanceTo(r.pos);if(d<bd){bd=d;best=r}}return best}
function buildCamp(a){if(buildings.length)return false;if(a.wood<6||a.stone<4)return false;const g=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.5,.35,10),new THREE.MeshStandardMaterial({color:0x70512f}));const roof=new THREE.Mesh(new THREE.ConeGeometry(3.2,2.6,10),new THREE.MeshStandardMaterial({color:0x8d5d35}));base.position.y=.18;roof.position.y=1.55;g.add(base,roof);g.position.set(a.q.position.x,0,a.q.position.z);world.add(g);buildings.push(g);a.wood-=6;a.stone-=4;log(`${a.name} построил первое убежище.`);return true}
function gather(a,r,dt){a.state=r.type==='wood'?'собирает дерево':r.type==='stone'?'собирает камень':'собирает еду';a.target.copy(r.pos);if(a.q.position.distanceTo(r.pos)<1.5){r.busy=1;a.carry=r;if(r.amount>0){r.amount=Math.max(0,r.amount-dt*.45);if(r.type==='wood')a.wood+=dt*.45;else if(r.type==='stone')a.stone+=dt*.45;else a.food+=dt*.45}if(r.amount<=0){r.busy=0;a.carry=null}}}
function updateAgent(a,dt){if(a.talk>0){a.talk-=dt;a.state='общается';const other=a===alpha?beta:alpha;a.q.lookAt(other.q.position.x,1,other.q.position.z);if(a.talk<=0){a.ring.visible=false;a.bubble=''}return}a.hu=clamp(a.hu+dt*.9,0,100);a.en=clamp(a.en-dt*.32,0,100);if(a.food>0&&a.hu>78){a.food=Math.max(0,a.food-1);a.hu=20;a.state='ест'}if(a.en<22){a.state='отдыхает';a.en=clamp(a.en+dt*1.2,0,100);return}
if(!buildings.length&&a.wood>=6&&a.stone>=4){a.state='строит';if(buildCamp(a))return}
let r=null;if(a.hu>65)r=null;else if(a.wood<6)r=nearestResource(a,'wood');else if(a.stone<4)r=nearestResource(a,'stone');
if(r){gather(a,r,dt)}else if(a.hu>55){a.state='ищет еду';a.target.set(-27,0,-21)}else{a.state=a.kn<30?'изучает мир':'исследует';if(a.q.position.distanceTo(a.target)<1.4)a.target.set(rnd(-45,45),0,rnd(-45,45));}
let d=a.target.clone().sub(a.q.position);d.y=0;if(d.lengthSq()>.02){d.normalize();const speed=a.state==='изучает мир'?.45:a.state.includes('собирает')?.7:.82;a.q.position.addScaledVector(d,dt*speed);a.q.lookAt(a.q.position.clone().add(d))}a.kn=clamp(a.kn+dt*.08,0,100);a.tech=clamp(a.tech+dt*.004,0,100)}
function updateClock(){const now=new Date();document.querySelector('#clock').textContent=now.toLocaleTimeString('ru-RU');const startDay=new Date();const dayNumber=1+Math.floor((now.getTime()-startEpoch)/86400000);document.querySelector('#day').textContent=`День ${dayNumber} · реальное время мира`}
const startEpoch=Date.now();
function ui(){document.querySelector('#stats').innerHTML=`<div class="stat">🤝 Связь: <b>${Math.round(relation)}%</b></div>${agents.map(a=>`<div class="stat"><b>${a.name}</b> · ${a.state}<br>⚡ ${Math.round(a.en)} · 🍖 ${Math.round(a.hu)} · 🧠 ${Math.round(a.kn)} · 🪵 ${Math.floor(a.wood)} · 🪨 ${Math.floor(a.stone)} · память ${a.memory.length}</div>`).join('')}`;document.querySelector('#worldStats').innerHTML=`🌲 Деревьев: ${resources.filter(r=>r.type==='wood'&&r.amount>0).length} · 🪨 Камней: ${resources.filter(r=>r.type==='stone'&&r.amount>0).length}<br>🏕️ Построек: ${buildings.length}`;document.querySelector('#log').innerHTML=logs.length?logs.map(x=>`<div class="log"><small>${x.t}</small><br>${x.text}</div>`).join(''):'Мир только начинается.'}
function project(a){const v=a.q.position.clone();v.y=3;v.project(camera);const X=(v.x*.5+.5)*innerWidth,Y=(-v.y*.5+.5)*innerHeight;a.ne.style.left=X+'px';a.ne.style.top=Y+'px';a.be.style.left=X+'px';a.be.style.top=Y-18+'px';a.be.style.display=a.bubble?'block':'none'}
function cam(){if(follow){const p=follow.q.position;camera.position.lerp(new THREE.Vector3(p.x+Math.sin(camYaw)*camRad,7+Math.sin(camPitch)*7,p.z+Math.cos(camYaw)*camRad),.07);camera.lookAt(p.x,1.2,p.z);return}let p=autoTarget?autoTarget.q.position:new THREE.Vector3(0,0,0);camera.position.lerp(new THREE.Vector3(p.x+Math.sin(camYaw)*camRad,7+Math.sin(camPitch)*7,p.z+Math.cos(camYaw)*camRad),.04);camera.lookAt(p.x,1,p.z)}
function autoCamera(dt){if(!auto)return;autoTimer-=dt;if(autoTimer<=0){const talking=agents.filter(a=>a.talk>0);autoTarget=talking.length?talking[Math.floor(Math.random()*talking.length)]:agents[Math.floor(Math.random()*agents.length)];autoTimer=8+rnd(0,12)}}
const pointers=new Map();let pinch0=0,rad0=camRad,lastX=0,lastY=0;const distance=()=>{const p=[...pointers.values()];return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};function manual(){follow=null;auto=false}
renderer.domElement.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){lastX=e.clientX;lastY=e.clientY}else{pinch0=distance();rad0=camRad}},{passive:false});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(Math.abs(dx)+Math.abs(dy)>1){manual();camYaw-=dx*.008;camPitch=clamp(camPitch-dy*.006,.12,1.25)}}else if(pinch0){camRad=clamp(rad0*pinch0/Math.max(1,distance()),10,65)}},{passive:false});['pointerup','pointercancel','pointerleave'].forEach(k=>renderer.domElement.addEventListener(k,e=>pointers.delete(e.pointerId)));
pause.onclick=()=>{paused=!paused;pause.textContent=paused?'▶️ Продолжить':'⏸ Пауза'};fa.onclick=()=>{follow=alpha;auto=false};fb.onclick=()=>{follow=beta;auto=false};free.onclick=()=>{follow=null;auto=false};auto.onclick=()=>{auto=!auto;follow=null;autoTarget=null};new.onclick=()=>location.reload();
let last=performance.now(),lastUI=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min(.1,(now-last)/1000);last=now;if(!paused){updateAgent(alpha,dt);updateAgent(beta,dt);if(alpha.q.position.distanceTo(beta.q.position)<2.8)talk(alpha,beta)}autoCamera(dt);cam();agents.forEach(project);if(now-lastUI>700){ui();lastUI=now}updateClock();renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});log('День 1 начался. Альфа и Бета появились в мире.');
</script></body></html>
