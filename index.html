<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b0e">
<title>AI Life 2.0 — OpenAI & Cloude</title>
<link rel="stylesheet" href="./css/style.css?v=20260920">
</head>
<body>
<div id="game"></div>
<div id="dialogue-layer" aria-live="polite" aria-label="Реплики персонажей"></div>
<div id="orientation" class="orientation">
  <div class="orientation-card">
    <div class="orientation-mark">AI LIFE</div>
    <div class="orientation-title">Горизонтальный эксперимент</div>
    <div class="orientation-copy">AI Life 2.0 работает в портретном и широком формате.</div>
  </div>
</div>
<header class="hud top-hud">
  <div class="brand"><span class="brand-mark">◉</span><span>AI LIFE</span><span class="version">2.0</span><span class="live"><i></i> LIVE</span></div>
  <div class="subjects"><span class="subject openai-dot"></span>OpenAI <b>·</b> <span class="subject cloude-dot"></span>Cloude</div>
  <div class="clock" id="clock">--:--:--</div>
</header>
<section class="scene-status" aria-live="polite">
  <div class="status-line"><span class="status-dot"></span><span id="worldStatus">Наблюдение за миром</span></div>
</section>

<aside class="agent-metrics agent-metrics-left" id="openaiMetrics" aria-label="Метрики OpenAI">
  <div class="metrics-avatar metrics-avatar-openai">
    <span class="avatar-halo"></span><span class="avatar-head"><span class="avatar-face"><i></i><i></i><b></b></span></span><span class="avatar-body"></span>
  </div>
  <div class="metrics-info">
    <div class="metrics-head"><strong>OpenAI</strong><span id="openaiState">наблюдает</span></div>
    <div class="metric-line"><span>❤️</span><div class="metric-track"><i id="openaiLife"></i></div><b id="openaiLifeValue">74</b></div>
    <div class="metric-line"><span>🍖</span><div class="metric-track"><i id="openaiFood"></i></div><b id="openaiFoodValue">80</b></div>
    <div class="metric-line"><span>💧</span><div class="metric-track"><i id="openaiWater"></i></div><b id="openaiWaterValue">78</b></div>
    <div class="metric-line"><span>⚡</span><div class="metric-track"><i id="openaiEnergy"></i></div><b id="openaiEnergyValue">82</b></div>
  </div>
</aside>
<aside class="agent-metrics agent-metrics-right" id="cloudeMetrics" aria-label="Метрики Cloude">
  <div class="metrics-avatar metrics-avatar-cloude">
    <span class="avatar-halo"></span><span class="avatar-head"><span class="avatar-face"><i></i><i></i><b></b></span></span><span class="avatar-body"></span>
  </div>
  <div class="metrics-info">
    <div class="metrics-head"><strong>Cloude</strong><span id="cloudeState">наблюдает</span></div>
    <div class="metric-line"><span>❤️</span><div class="metric-track"><i id="cloudeLife"></i></div><b id="cloudeLifeValue">74</b></div>
    <div class="metric-line"><span>🍖</span><div class="metric-track"><i id="cloudeFood"></i></div><b id="cloudeFoodValue">80</b></div>
    <div class="metric-line"><span>💧</span><div class="metric-track"><i id="cloudeWater"></i></div><b id="cloudeWaterValue">78</b></div>
    <div class="metric-line"><span>⚡</span><div class="metric-track"><i id="cloudeEnergy"></i></div><b id="cloudeEnergyValue">82</b></div>
  </div>
</aside>
<aside class="observatory" id="observatory" aria-hidden="true">
  <button class="panel-close" id="closePanel" aria-label="Закрыть">×</button>
  <div class="panel-kicker">НАБЛЮДЕНИЕ</div>
  <div class="panel-title">Состояние двух автономных разумов</div>
  <div id="stats"></div>
  <div class="events-head"><span>События</span><span id="eventCount">0</span></div>
  <div id="events" class="events"></div>
</aside>
<div class="experiment-pill">
  <span class="pill-icon">✦</span>
  <span><b>ЭКСПЕРИМЕНТ</b><small id="pillDay">ДЕНЬ 001</small></span>
</div>
<script type="module" src="./js/main.js?v=20260920"></script>
</body>
</html>
