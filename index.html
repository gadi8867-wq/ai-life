<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Life — OpenAI vs Cloude</title>
<link rel="stylesheet" href="./css/style.css">
<style>
.live{color:#ff3030;text-shadow:0 0 8px #ff3030,0 0 16px #ff303066;animation:livePulse 1s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1;text-shadow:0 0 7px #ff3030,0 0 14px #ff303055}50%{opacity:.62;text-shadow:0 0 2px #ff3030,0 0 8px #ff303044}}
</style>
</head>
<body>
<div id="game"></div>
<div class="panel top">
  <div class="toprow">
    <h1>🌍 AI LIFE <span class="live">● LIVE</span></h1>
    <span class="models">OpenAI &nbsp;·&nbsp; Cloude</span>
    <span class="badge" id="day">ЭКСПЕРИМЕНТ НЕ НАЧАТ</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</div>
<div class="panel right" id="rightPanel">
  <button class="close-panel" id="closePanel">×</button>
  <div class="title">🧠 Метрики</div>
  <div id="stats"></div>
  <div class="title">📜 События</div>
  <div id="events">Мир готов. Мы ничего не задаём персонажам.</div>
</div>
<div class="radial" id="controlMenu">
  <button class="start" id="start" title="Запустить">▶️</button>
  <button id="pause" title="Пауза">⏸</button>
  <button id="followA" title="Следить за OpenAI">👤</button>
  <button id="followB" title="Следить за Cloude">👥</button>
  <button id="free" title="Свободная камера">🎥</button>
  <button id="auto" title="Автокамера">🎬</button>
</div>
<button class="orb left-orb" id="controlOrb" aria-label="Управление">💻</button>
<button class="orb right-orb" id="brainOrb" aria-label="Метрики и события">🧠</button>
<div class="experiment-pill">
  <div class="pill-title">🧪 Эксперимент</div>
  <div class="pill-meta">
    <span id="pillStart">Старт: —</span>
    <span>День: <b id="pillDay">—</b></span>
    <span>Вмешательство: <b>0</b></span>
  </div>
</div>
<script type="module" src="./js/main.js"></script>
<script>
  // UI names only: internal alpha/beta identifiers stay unchanged for simulation persistence.
  const renameUI=()=>{
    document.querySelectorAll('.name,.agent-name').forEach(el=>{
      el.textContent=el.textContent.replace(/Альфа/g,'OpenAI').replace(/Бета/g,'Cloude');
    });
    const events=document.querySelector('#events');
    if(events) events.innerHTML=events.innerHTML.replace(/Альфа/g,'OpenAI').replace(/Бета/g,'Cloude');
  };
  new MutationObserver(renameUI).observe(document.body,{subtree:true,childList:true,characterData:true});
  renameUI();
</script>
</body>
</html>
