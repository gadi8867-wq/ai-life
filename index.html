<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Life — автономный 3D мир</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}button{border:1px solid #ffffff2b;background:#111827dd;color:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:600}button:active,button.active{background:#2563ebaa}#top{position:fixed;left:12px;top:12px;z-index:5;padding:12px 14px;border:1px solid #ffffff20;background:#07101dcc;backdrop-filter:blur(10px);border-radius:14px;pointer-events:none}#top h1{font-size:20px;margin:0 0 3px}.sub{opacity:.72;font-size:12px}#right{position:fixed;right:12px;top:12px;z-index:5;width:270px;max-height:55vh;overflow:auto;padding:12px;border:1px solid #ffffff20;background:#07101dcc;backdrop-filter:blur(10px);border-radius:14px}.title{font-weight:800;margin-bottom:7px}.log{font-size:12px;line-height:1.35;margin:7px 0;padding:7px;border-radius:9px;background:#ffffff0b}.bubble{position:fixed;z-index:4;transform:translate(-50%,-100%);max-width:190px;padding:7px 10px;border-radius:12px;background:#fff;color:#111;font-size:12px;font-weight:700;box-shadow:0 5px 20px #0008;pointer-events:none;display:none}.name{position:fixed;z-index:4;transform:translate(-50%,-50%);font-size:12px;font-weight:800;text-shadow:0 2px 5px #000;pointer-events:none}#bottom{position:fixed;left:12px;right:12px;bottom:12px;z-index:6;display:flex;gap:7px;padding:8px;border:1px solid #ffffff20;background:#07101dcc;backdrop-filter:blur(10px);border-radius:14px;overflow-x:auto}#hint{margin-top:8px;opacity:.65;font-size:11px}@media(max-width:700px){#top{left:8px;right:8px;top:8px;padding:10px 12px}#top h1{font-size:17px}#right{left:8px;right:8px;top:auto;bottom:76px;width:auto;max-height:28vh}#bottom{left:8px;right:8px;bottom:8px;gap:6px}#bottom button{min-height:44px;padding:10px 12px;font-size:13px}button{min-height:42px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><h1>🌍 AI Life</h1><div class="sub">Автономный 3D-мир · мы только наблюдаем</div></div>
<div id="right"><div class="title">💬 Журнал диалогов</div><div id="dialogueLog">Пока никто не разговаривает.</div><div id="hint">Проведи пальцем — камера · двумя пальцами — масштаб</div></div>
<div id="bottom"><button id="pauseBtn">⏸ Пауза</button><button id="speedBtn">⏩ x1</button><button id="followABtn">👤 Альфа</button><button id="followBBtn">👤 Бета</button><button id="freeBtn">🎥 Свободно</button><button id="autoCamBtn">🎬 Автокамера</button><button id="newBtn">🌱 Новый мир</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x08111a);scene.fog=new THREE.Fog(0x08111a,45,115);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);camera.position.set(0,18,32);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xaed8ff,0x203020,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(20,40,15);scene.add(sun);
const world=new THREE.Group();scene.add(world);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120,40,40),new THREE.MeshStandardMaterial({color:0x31583a,roughness:1}));ground.rotation.x=-Math.PI/2;world.add(ground);
const water=new THREE.Mesh(new THREE.CircleGeometry(14,48),new THREE.MeshStandardMaterial({color:0x1b6580,transparent:true,opacity:.8,roughness:.2}));water.rotation.x=-Math.PI/2;water.position.set(-25,.03,-20);world.add(water);
function rnd(a,b){return a+Math.random()*(b-a)}
function tree(x,z){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,2.2,8),new THREE.MeshStandardMaterial({color:0x5a3820}));trunk.position.y=1.1;g.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.2,2.7,9),new THREE.MeshStandardMaterial({color:0x1f6a39}));crown.position.y=2.8;g.add(crown);g.position.set(x,0,z);world.add(g)}
for(let i=0;i<45;i++){let x=rnd(-50,50),z=rnd(-50,50);if(Math.hypot(x+25,z+20)>17)tree(x,z)}
for(let i=0;i<28;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(.35,.8)),new THREE.MeshStandardMaterial({color:0x77736a,roughness:1}));m.position.set(rnd(-50,50),.5,rnd(-50,50));world.add(m)}
const agents=[];let paused=false,speed=1,follow=null,autoCamera=false,autoTarget=null,autoTimer=0;
function makeAgent(name,color,x,z){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.2,6,12),new THREE.MeshStandardMaterial({color}));body.position.y=1.25;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.58,16,12),new THREE.MeshStandardMaterial({color:0xf0c7a0}));head.position.y=2.35;g.add(head);const ring=new THREE.Mesh(new THREE.RingGeometry(.8,1.0,32),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.04;ring.visible=false;g.add(ring);g.position.set(x,0,z);scene.add(g);const a={name,color,mesh:g,ring,energy:100,hunger:0,knowledge:0,tech:0,state:'исследует',talk:0,target:new THREE.Vector3(rnd(-40,40),0,rnd(-40,40)),bubble:'',bubbleEl:null,nameEl:null};agents.push(a);return a}
const A=makeAgent('Альфа',0x55c7ff,-8,5),B=makeAgent('Бета',0xff9b62,8,-3);
for(const a of agents){a.nameEl=document.createElement('div');a.nameEl.className='name';a.nameEl.textContent=a.name;document.body.appendChild(a.nameEl);a.bubbleEl=document.createElement('div');a.bubbleEl.className='bubble';document.body.appendChild(a.bubbleEl)}
const phrases=[['Привет. Что ты исследовал?','Я нашёл новый участок леса.'],['Давай изучим это место вместе.','Хорошо, мне интересно.'],['Как продвигается строительство?','Я собираю ресурсы и думаю над планом.'],['Здесь спокойно.','Да. Можно продолжать исследование.']];
function speak(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}
const logs=[];function logDialogue(a,b){const p=phrases[Math.floor(Math.random()*phrases.length)];logs.push(`<b>${a.name}:</b> ${p[0]}<br><b>${b.name}:</b> ${p[1]}`);while(logs.length>10)logs.shift();document.getElementById('dialogueLog').innerHTML=logs.slice().reverse().map(x=>`<div class="log">${x}</div>`).join('');a.bubble=p[0];b.bubble=p[1];a.bubbleEl.textContent=a.bubble;b.bubbleEl.textContent=b.bubble;speak(p[0]);setTimeout(()=>speak(p[1]),1800)}
function startTalk(a,b){if(a.talk>0||b.talk>0)return;a.talk=b.talk=7;a.ring.visible=b.ring.visible=true;logDialogue(a,b)}
function updateAgent(a,dt){if(a.talk>0){a.talk-=dt;a.mesh.lookAt(a.mesh.position.clone().set(a.mesh.position.x,1,a.mesh.position.z).add(B===a?A.mesh.position:A.mesh.position));if(a.talk<=0){a.ring.visible=false;a.bubble=''}return}a.hunger=Math.min(100,a.hunger+dt*1.3);a.energy=Math.max(0,a.energy-dt*.65);if(a.energy<25){a.state='отдыхает';a.energy=Math.min(100,a.energy+dt*2);return}if(a.hunger>70)a.state='ищет еду';else if(a.knowledge<60)a.state='изучает мир';else a.state='исследует';const d=a.mesh.position.distanceTo(a.target);if(d<1.2)a.target.set(rnd(-45,45),0,rnd(-45,45));const dir=a.target.clone().sub(a.mesh.position);dir.y=0;if(dir.lengthSq()>0.01){dir.normalize();a.mesh.position.addScaledVector(dir,dt*(a.state==='изучает мир'?.65:1.05)*speed);a.mesh.lookAt(a.mesh.position.clone().add(dir))}a.knowledge=Math.min(100,a.knowledge+dt*.35);a.tech=Math.min(100,a.tech+dt*.03)}
function updateCamera(){if(follow){const p=follow.mesh.position;const desired=new THREE.Vector3(p.x+Math.sin(yaw)*rad,8+Math.sin(pitch)*8,p.z+Math.cos(yaw)*rad);camera.position.lerp(desired,.08);camera.lookAt(p.x,1.5,p.z);return}const target=new THREE.Vector3(0,1,0);camera.position.set(target.x+Math.sin(yaw)*rad*Math.cos(pitch),target.y+Math.sin(pitch)*rad,target.z+Math.cos(yaw)*rad*Math.cos(pitch));camera.lookAt(target)}
let yaw=.6,pitch=.55,rad=32;const pointers=new Map();let pinchStartDist=0,pinchStartRad=rad,lastX=0,lastY=0;
function pDist(){const p=[...pointers.values()];return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
function manual(){follow=null;document.querySelectorAll('#bottom button').forEach(b=>b.classList.remove('active'))}
renderer.domElement.addEventListener('pointerdown',e=>{e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){lastX=e.clientX;lastY=e.clientY}else{pinchStartDist=pDist();pinchStartRad=rad}},{passive:false});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(Math.abs(dx)+Math.abs(dy)>.5){manual();yaw-=dx*.008;pitch=Math.max(.12,Math.min(1.35,pitch-dy*.006))}}else if(pinchStartDist>0)rad=Math.max(10,Math.min(65,pinchStartRad*pinchStartDist/Math.max(1,pDist())))},{passive:false});function up(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStartDist=0}renderer.domElement.addEventListener('pointerup',up);renderer.domElement.addEventListener('pointercancel',up);
function updateAuto(dt){if(!autoCamera)return;autoTimer-=dt;if(autoTimer<=0||!autoTarget){const talking=agents.filter(a=>a.talk>0);autoTarget=talking.length?talking[Math.floor(Math.random()*talking.length)]:agents[Math.floor(Math.random()*agents.length)];autoTimer=7+Math.random()*8}const p=autoTarget.mesh.position;const desired=Math.atan2(p.x-camera.position.x,p.z-camera.position.z);yaw+=Math.atan2(Math.sin(desired-yaw),Math.cos(desired-yaw))*.025}
document.getElementById('pauseBtn').onclick=()=>{paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶️ Продолжить':'⏸ Пауза'};document.getElementById('speedBtn').onclick=()=>{speed=speed===1?2:speed===2?4:1;document.getElementById('speedBtn').textContent='⏩ x'+speed};document.getElementById('followABtn').onclick=()=>{follow=A;autoCamera=false};document.getElementById('followBBtn').onclick=()=>{follow=B;autoCamera=false};document.getElementById('freeBtn').onclick=()=>{follow=null;autoCamera=false};document.getElementById('autoCamBtn').onclick=()=>{autoCamera=!autoCamera;follow=null;document.getElementById('autoCamBtn').classList.toggle('active',autoCamera)};document.getElementById('newBtn').onclick=()=>location.reload();
function project(a){const v=a.mesh.position.clone();v.y=3.2;v.project(camera);const x=(v.x*.5+.5)*innerWidth,y=(-v.y*.5+.5)*innerHeight;a.nameEl.style.left=x+'px';a.nameEl.style.top=y+'px';if(a.bubble){a.bubbleEl.style.display='block';a.bubbleEl.style.left=x+'px';a.bubbleEl.style.top=(y-18)+'px'}else a.bubbleEl.style.display='none'}
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-prev)/1000);prev=now;if(!paused){for(const a of agents)updateAgent(a,dt);if(A.mesh.position.distanceTo(B.mesh.position)<3)startTalk(A,B)}updateAuto(dt);updateCamera();for(const a of agents)project(a);renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
