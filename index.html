<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Life — автономный 3D мир</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}button{border:1px solid #ffffff2b;background:#111827dd;color:#fff;border-radius:12px;padding:9px 12px;font-weight:600}#top,#right,#bottom{position:fixed;z-index:5;border:1px solid #ffffff20;background:#07101dcc;backdrop-filter:blur(10px);border-radius:14px}#top{left:12px;top:12px;padding:12px 14px;pointer-events:none}#top h1{font-size:20px;margin:0 0 3px}.sub,.hint{opacity:.7;font-size:12px}#right{right:12px;top:12px;width:285px;max-height:58vh;overflow:auto;padding:12px}.title{font-weight:800;margin-bottom:7px}.log{font-size:12px;line-height:1.35;margin:6px 0;padding:7px;border-radius:9px;background:#ffffff0b}.stat{font-size:12px;margin:4px 0}.bubble{position:fixed;z-index:4;transform:translate(-50%,-100%);max-width:200px;padding:7px 10px;border-radius:12px;background:#fff;color:#111;font-size:12px;font-weight:700;box-shadow:0 5px 20px #0008;pointer-events:none;display:none}.name{position:fixed;z-index:4;transform:translate(-50%,-50%);font-size:12px;font-weight:800;text-shadow:0 2px 5px #000;pointer-events:none}#bottom{left:12px;right:12px;bottom:12px;display:flex;gap:7px;padding:8px;overflow-x:auto}@media(max-width:700px){#top{left:8px;right:8px;top:8px;padding:10px 12px}#top h1{font-size:17px}#right{left:8px;right:8px;top:auto;bottom:76px;width:auto;max-height:30vh}#bottom{left:8px;right:8px;bottom:8px}button{min-height:44px}}
</style></head><body><div id="game"></div><div id="top"><h1>🌍 AI Life</h1><div class="sub">Автономный 3D-мир · мы только наблюдаем</div></div><div id="right"><div class="title">🧠 Память и отношения</div><div id="stats"></div><div class="title" style="margin-top:10px">💬 Журнал</div><div id="log">Пока никто не разговаривает.</div><div class="hint">Палец — камера · два пальца — масштаб</div></div><div id="bottom"><button id="pause">⏸ Пауза</button><button id="speed">⏩ x1</button><button id="fa">👤 Альфа</button><button id="fb">👤 Бета</button><button id="free">🎥 Свободно</button><button id="auto">🎬 Автокамера</button><button id="new">🌱 Новый мир</button></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const S=new THREE.Scene();S.background=new THREE.Color(0x08111a);S.fog=new THREE.Fog(0x08111a,45,115);const C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200),R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.querySelector('#game').append(R.domElement);S.add(new THREE.HemisphereLight(0xaed8ff,0x203020,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,40,15);S.add(sun);const W=new THREE.Group();S.add(W);let g=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x31583a}));g.rotation.x=-Math.PI/2;W.add(g);let wa=new THREE.Mesh(new THREE.CircleGeometry(14,40),new THREE.MeshStandardMaterial({color:0x1b6580,transparent:true,opacity:.8}));wa.rotation.x=-Math.PI/2;wa.position.set(-25,.03,-20);W.add(wa);const rnd=(a,b)=>a+Math.random()*(b-a);function tree(x,z){let q=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,2.2,8),new THREE.MeshStandardMaterial({color:0x5a3820})),c=new THREE.Mesh(new THREE.ConeGeometry(1.2,2.7,9),new THREE.MeshStandardMaterial({color:0x1f6a39}));t.position.y=1.1;c.position.y=2.8;q.add(t,c);q.position.set(x,0,z);W.add(q)}for(let i=0;i<45;i++){let x=rnd(-50,50),z=rnd(-50,50);if(Math.hypot(x+25,z+20)>17)tree(x,z)}for(let i=0;i<28;i++){let m=new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(.35,.8)),new THREE.MeshStandardMaterial({color:0x77736a}));m.position.set(rnd(-50,50),.5,rnd(-50,50));W.add(m)}
const A=[],logs=[];let relation=42,paused=0,spd=1,follow=null,auto=0,at=null,atime=0;function agent(name,col,x,z){let q=new THREE.Group(),b=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.2,6,12),new THREE.MeshStandardMaterial({color:col})),h=new THREE.Mesh(new THREE.SphereGeometry(.58,16,12),new THREE.MeshStandardMaterial({color:0xf0c7a0})),r=new THREE.Mesh(new THREE.RingGeometry(.8,1,32),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.9,side:THREE.DoubleSide}));b.position.y=1.25;h.position.y=2.35;r.rotation.x=-Math.PI/2;r.position.y=.04;r.visible=false;q.add(b,h,r);q.position.set(x,0,z);S.add(q);let e={name,col,q,r,en:100,hu:0,kn:0,tech:0,state:'исследует',talk:0,target:new THREE.Vector3(rnd(-45,45),0,rnd(-45,45)),memory:[],bubble:'',ne:document.createElement('div'),be:document.createElement('div')};e.ne.className='name';e.ne.textContent=name;e.be.className='bubble';document.body.append(e.ne,e.be);A.push(e);return e}let a=agent('Альфа',0x55c7ff,-8,5),b=agent('Бета',0xff9b62,8,-3);
const phrases=[['Привет. Что ты исследовал?','Я нашёл новый участок леса.'],['Давай изучим это место вместе.','Хорошо, мне интересно.'],['Как продвигается строительство?','Я собираю ресурсы и думаю над планом.'],['Здесь спокойно.','Да. Можно продолжать исследование.'],['Я запомню это место.','И я запомню наш разговор.']];function say(t){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.95;speechSynthesis.speak(u)}}function talk(x,y){if(x.talk>0||y.talk>0)return;x.talk=y.talk=7;x.r.visible=y.r.visible=true;let p=phrases[Math.floor(Math.random()*phrases.length)];relation=Math.min(100,relation+2);let rec={time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),text:`${x.name}: ${p[0]}<br>${y.name}: ${p[1]}`};logs.unshift(rec);while(logs.length>10)logs.pop();x.memory.unshift({with:y.name,text:p[0],time:rec.time});y.memory.unshift({with:x.name,text:p[1],time:rec.time});x.memory=x.memory.slice(0,8);y.memory=y.memory.slice(0,8);x.be.textContent=p[0];y.be.textContent=p[1];x.bubble=p[0];y.bubble=p[1];say(p[0]);setTimeout(()=>say(p[1]),1700)}function update(x,dt){if(x.talk>0){x.talk-=dt;x.q.lookAt(x.q.position.clone().set(b===x?a.q.position.x:b.q.position.x,1,b===x?a.q.position.z:b.q.position.z));if(x.talk<=0){x.r.visible=false;x.bubble=''}return}x.hu=Math.min(100,x.hu+dt*1.3);x.en=Math.max(0,x.en-dt*.65);if(x.en<25){x.state='отдыхает';x.en=Math.min(100,x.en+dt*2);return}if(x.hu>70)x.state='ищет еду';else if(x.kn<60)x.state='изучает мир';else x.state='исследует';if(x.q.position.distanceTo(x.target)<1.2)x.target.set(rnd(-45,45),0,rnd(-45,45));let d=x.target.clone().sub(x.q.position);d.y=0;if(d.lengthSq()>.01){d.normalize();x.q.position.addScaledVector(d,dt*(x.state==='изучает мир'?.65:1.05)*spd);x.q.lookAt(x.q.position.clone().add(d))}x.kn=Math.min(100,x.kn+dt*.35);x.tech=Math.min(100,x.tech+dt*.03)}
let yaw=.6,pitch=.55,rad=32;function cam(){if(follow){let p=follow.q.position;C.position.lerp(new THREE.Vector3(p.x+Math.sin(yaw)*rad,8+Math.sin(pitch)*8,p.z+Math.cos(yaw)*rad),.08);C.lookAt(p.x,1.5,p.z);return}let t=new THREE.Vector3(0,1,0);C.position.set(t.x+Math.sin(yaw)*rad*Math.cos(pitch),t.y+Math.sin(pitch)*rad,t.z+Math.cos(yaw)*rad*Math.cos(pitch));C.lookAt(t)}let pts=new Map(),pd=0,pr=rad,lx=0,ly=0;const dist=()=>{let p=[...pts.values()];return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};function manual(){follow=null;auto=0}R.domElement.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){lx=e.clientX;ly=e.clientY}else{pd=dist();pr=rad}},{passive:false});R.domElement.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;if(Math.abs(dx)+Math.abs(dy)>1){manual();yaw-=dx*.008;pitch=Math.max(.12,Math.min(1.35,pitch-dy*.006))}}else if(pd)rad=Math.max(10,Math.min(65,pr*pd/Math.max(1,dist())))},{passive:false});['pointerup','pointercancel'].forEach(e=>R.domElement.addEventListener(e,x=>pts.delete(x.pointerId)));
function ui(){document.querySelector('#stats').innerHTML=`<div class="stat">🤝 Связь Альфа ↔ Бета: <b>${Math.round(relation)}%</b></div>${A.map(x=>`<div class="stat"><b>${x.name}</b> · ${x.state} · энергия ${Math.round(x.en)} · знание ${Math.round(x.kn)} · память ${x.memory.length}</div>`).join('')}`;document.querySelector('#log').innerHTML=logs.length?logs.map(x=>`<div class="log"><small>${x.time}</small><br>${x.text}</div>`).join(''):'Пока никто не разговаривает.'}function project(x){let v=x.q.position.clone();v.y=3.2;v.project(C);let X=(v.x*.5+.5)*innerWidth,Y=(-v.y*.5+.5)*innerHeight;x.ne.style.left=X+'px';x.ne.style.top=Y+'px';x.be.style.left=X+'px';x.be.style.top=Y-18+'px';x.be.style.display=x.bubble?'block':'none'}function autoCam(dt){if(!auto)return;atime-=dt;if(atime<=0||!at){let t=A.filter(x=>x.talk>0);at=t.length?t[Math.floor(Math.random()*t.length)]:A[Math.floor(Math.random()*A.length)];atime=7+Math.random()*8}let p=at.q.position,d=Math.atan2(p.x-C.position.x,p.z-C.position.z);yaw+=Math.atan2(Math.sin(d-yaw),Math.cos(d-yaw))*.025}pause.onclick=()=>{paused=!paused;pause.textContent=paused?'▶️ Продолжить':'⏸ Пауза'};speed.onclick=()=>{spd=spd===1?2:spd===2?4:1;speed.textContent='⏩ x'+spd};fa.onclick=()=>{follow=a;auto=0};fb.onclick=()=>{follow=b;auto=0};free.onclick=()=>{follow=null;auto=0};auto.onclick=()=>{auto=!auto;follow=null};new.onclick=()=>location.reload();let last=performance.now(),lastUI=0;function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){A.forEach(x=>update(x,dt));if(a.q.position.distanceTo(b.q.position)<3)talk(a,b)}autoCam(dt);cam();A.forEach(project);if(now-lastUI>500){ui();lastUI=now}R.render(S,C)}requestAnimationFrame(loop);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});</script></body></html>
