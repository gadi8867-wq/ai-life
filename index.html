<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Life — Living World 24/7</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061018;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;z-index:5;border:1px solid #ffffff22;background:#07101dcc;backdrop-filter:blur(10px);border-radius:14px}.top{left:12px;top:12px;padding:11px 14px}.top h1{margin:0;font-size:20px}.sub{font-size:11px;opacity:.7}.right{right:12px;top:12px;width:290px;max-height:58vh;overflow:auto;padding:12px}.title{font-weight:800;margin-bottom:7px}.stat{font-size:12px;margin:5px 0}.event{font-size:12px;line-height:1.35;margin:6px 0;padding:7px;border-radius:9px;background:#ffffff0b}.bottom{left:12px;right:12px;bottom:12px;padding:8px;display:flex;gap:7px;overflow-x:auto}.bottom button{border:1px solid #ffffff2b;background:#111827dd;color:#fff;border-radius:11px;padding:9px 12px;font-weight:700;white-space:nowrap;min-height:42px}.clock{font-size:18px;font-weight:900}.badge{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:999px;background:#163e32;font-size:10px;font-weight:800}.bubble,.name{position:fixed;z-index:6;pointer-events:none;transform:translate(-50%,-100%);text-shadow:0 2px 5px #000}.name{font-size:12px;font-weight:900}.bubble{display:none;max-width:210px;padding:7px 10px;border-radius:12px;background:#fff;color:#111;font-size:12px;font-weight:700;text-shadow:none}.build{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:6;padding:6px 10px;border-radius:999px;background:#111a;color:#fff;font-size:11px;display:none}
@media(max-width:700px){.top{left:8px;top:8px}.top h1{font-size:17px}.right{left:8px;right:8px;top:auto;bottom:72px;width:auto;max-height:28vh}.bottom{left:8px;right:8px;bottom:8px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="panel top"><h1>🌍 AI LIFE · LIVE</h1><div class="sub">Два автономных человека · реальное время · наблюдение 24/7</div><div class="clock" id="clock">--:--:--</div><span class="badge" id="day">DAY 1</span></div>
<div class="panel right"><div class="title">🧠 Состояние мира</div><div id="stats"></div><div class="title" style="margin-top:10px">📜 Последние события</div><div id="events">Мир только начинается.</div></div>
<div class="build" id="build">🔨 Строительство</div>
<div class="panel bottom"><button id="pause">⏸ Пауза</button><button id="followA">👤 Альфа</button><button id="followB">👤 Бета</button><button id="free">🎥 Свободно</button><button id="auto">🎬 Автокамера</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78a9b5);scene.fog=new THREE.Fog(0x78a9b5,48,125);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,220);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#game').append(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xbfe8ff,0x29452f,1.5);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff1d0,2.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;sun.position.set(25,50,20);scene.add(sun);
const world=new THREE.Group();scene.add(world);const rnd=(a,b)=>a+Math.random()*(b-a);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(130,130,20,20),new THREE.MeshStandardMaterial({color:0x355f3a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);
const river=new THREE.Mesh(new THREE.PlaneGeometry(22,130),new THREE.MeshStandardMaterial({color:0x2b7890,transparent:true,opacity:.78,roughness:.25,metalness:.05}));river.rotation.x=-Math.PI/2;river.position.set(-23,.035,0);world.add(river);
function tree(x,z,s=1){const q=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.34*s,2.4*s,8),new THREE.MeshStandardMaterial({color:0x5b3922}));trunk.position.y=1.2*s;trunk.castShadow=true;const c1=new THREE.Mesh(new THREE.ConeGeometry(1.25*s,2.8*s,9),new THREE.MeshStandardMaterial({color:0x28653a}));c1.position.y=3*s;c1.castShadow=true;q.add(trunk,c1);q.position.set(x,0,z);world.add(q);return q}
function rock(x,z,s=1){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.6*s,0),new THREE.MeshStandardMaterial({color:0x77776f,roughness:1}));m.position.set(x,.45*s,z);m.scale.y=.7;m.castShadow=true;m.receiveShadow=true;world.add(m);return m}
for(let i=0;i<70;i++){let x=rnd(-54,50),z=rnd(-54,54);if(Math.abs(x+23)<13)continue;tree(x,z,rnd(.7,1.25))}for(let i=0;i<45;i++){let x=rnd(-52,50),z=rnd(-52,52);if(Math.abs(x+23)<12)continue;rock(x,z,rnd(.55,1.2))}
// grass tufts
for(let i=0;i<140;i++){let g=new THREE.Mesh(new THREE.ConeGeometry(.08,.35,4),new THREE.MeshStandardMaterial({color:0x4c7b45}));g.position.set(rnd(-55,50),.17,rnd(-55,55));world.add(g)}
// campfire
const fire=new THREE.Group();fire.position.set(2,0,7);world.add(fire);for(let i=0;i<5;i++){let log=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,1.1,7),new THREE.MeshStandardMaterial({color:0x633b21}));log.rotation.z=Math.PI/2;log.rotation.y=i*Math.PI/2;log.position.y=.25;log.castShadow=true;fire.add(log)}const flame=new THREE.Mesh(new THREE.ConeGeometry(.48,1.35,8),new THREE.MeshBasicMaterial({color:0xff9b35,transparent:true,opacity:.85}));flame.position.y=1;fire.add(flame);const glow=new THREE.PointLight(0xff9b35,3,12);glow.position.y=1;fire.add(glow);
const A=[];let events=[];let relation=42;let paused=false;let follow=null;let auto=true;let yaw=.7,pitch=.55,rad=30;const clockEl=document.querySelector('#clock');
function agent(name,col,x,z){const q=new THREE.Group();const skin=new THREE.MeshStandardMaterial({color:0xc99572,roughness:.9});const cloth=new THREE.MeshStandardMaterial({color:col,roughness:.85});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,6,10),cloth);body.position.y=1.15;body.castShadow=true;const head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),skin);head.position.y=2.05;head.castShadow=true;const armL=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.58,5,8),skin),armR=armL.clone();armL.position.set(-.48,1.2,0);armR.position.set(.48,1.2,0);const legL=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.72,5,8),skin),legR=legL.clone();legL.position.set(-.18,.55,0);legR.position.set(.18,.55,0);const ring=new THREE.Mesh(new THREE.RingGeometry(.62,.75,32),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.8,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;ring.visible=false;q.add(body,head,armL,armR,legL,legR,ring);q.position.set(x,0,z);scene.add(q);const ne=document.createElement('div'),be=document.createElement('div');ne.className='name';be.className='bubble';ne.textContent=name;document.body.append(ne,be);const e={name,col,q,body,armL,armR,legL,legR,ring,ne,be,en:100,hu:15,kn:0,wood:0,stone:0,food:0,state:'осматривается',target:new THREE.Vector3(rnd(-42,42),0,rnd(-48,48)),memory:[],build:0,action:0};A.push(e);return e}
const a=agent('Альфа',0x4db8e8,-5,3),b=agent('Бета',0xe48b55,7,-5);
function log(t){events.unshift(new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),'');events=events.filter(Boolean).slice(0,8);document.querySelector('#events').innerHTML=events.map((e,i)=>`<div class="event">${e}</div>`).join('')}
const phrases=[['Привет.','Привет. Я только начинаю исследовать.'],['Здесь есть вода.','И лес. Нам нужно понять этот мир.'],['Нам понадобятся ресурсы.','Я займусь деревьями.'],['Давай останемся рядом.','Хорошо. Вместе безопаснее.']];
function talk(x,y){if(x.action>0||y.action>0)return;x.action=y.action=8;x.ring.visible=y.ring.visible=true;let p=phrases[Math.floor(Math.random()*phrases.length)];relation=Math.min(100,relation+1);x.memory.unshift(p[0]);y.memory.unshift(p[1]);x.memory=x.memory.slice(0,8);y.memory=y.memory.slice(0,8);x.be.textContent=p[0];y.be.textContent=p[1];log(`💬 ${x.name}: «${p[0]}» · ${y.name}: «${p[1]}»`);if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(p[0]);u.lang='ru-RU';u.rate=.9;window.speechSynthesis.speak(u)}}
function nearestResource(x,type){let best=null,bd=1e9;world.traverse(o=>{if(o.userData&&o.userData.type===type&&o.userData.amount>0){let d=x.q.position.distanceTo(o.position);if(d<bd){bd=d;best=o}}});return best}
// resource nodes
for(let i=0;i<18;i++){let x=rnd(-45,42),z=rnd(-48,48);let t=tree(x,z,.65);t.userData={type:'wood',amount:6};t.visible=true}for(let i=0;i<18;i++){let x=rnd(-45,42),z=rnd(-48,48);let r=rock(x,z,.8);r.userData={type:'stone',amount:5}}
function harvest(x,type){let r=nearestResource(x,type);if(!r)return false;x.target.copy(r.position);if(x.q.position.distanceTo(r.position)<1.7){r.userData.amount--;x[type==='wood'?'wood':'stone']++;x.state=type==='wood'?'собирает дерево':'собирает камень';if(r.userData.amount<=0)r.visible=false;log(`🪵 ${x.name} собрал ${type==='wood'?'древесину':'камень'}`);return true}return true}
let shelter=null;function build(x){if(!shelter&&x.wood>=3&&x.stone>=2){x.wood-=3;x.stone-=2;x.build=18;x.state='строит убежище';document.querySelector('#build').style.display='block';log(`🔨 ${x.name} начал строить первое убежище`);shelter=new THREE.Group();shelter.position.set(2,0,4);world.add(shelter);for(let i=0;i<4;i++){let p=new THREE.Mesh(new THREE.BoxGeometry(.18,2.2,3),new THREE.MeshStandardMaterial({color:0x76502d}));p.position.set(i<2?-1.5:1.5,1.1,i%2?-1.5:1.5);p.castShadow=true;shelter.add(p)}let roof=new THREE.Mesh(new THREE.ConeGeometry(2.5,1.6,4),new THREE.MeshStandardMaterial({color:0x5b3928}));roof.rotation.y=Math.PI/4;roof.position.y=2.6;roof.castShadow=true;shelter.add(roof)}}
function update(x,dt){if(x.action>0){x.action-=dt;x.ring.visible=true;if(x.action<=0){x.ring.visible=false;x.be.style.display='none'}return}x.hu=Math.min(100,x.hu+dt*.16);x.en=Math.max(0,x.en-dt*.07);if(x.en<28){x.state='отдыхает у костра';x.target.copy(fire.position)}else if(x.hu>82){x.state='ищет еду';x.target.set(rnd(-15,35),0,rnd(-40,40))}else if(!shelter&&x.wood<3){harvest(x,'wood');}else if(!shelter&&x.stone<2){harvest(x,'stone');}else if(!shelter){build(x)}else{x.state='исследует';if(x.q.position.distanceTo(x.target)<1.4)x.target.set(rnd(-45,45),0,rnd(-48,48))}
let d=x.target.clone().sub(x.q.position);d.y=0;if(d.lengthSq()>.02){d.normalize();let speed=x.state==='строит убежище'?.25:x.state.includes('собирает')?.65:.85;x.q.position.addScaledVector(d,dt*speed);x.q.lookAt(x.q.position.clone().add(d));const swing=Math.sin(performance.now()/120)*.45;x.armL.rotation.z=swing;x.armR.rotation.z=-swing;x.legL.rotation.x=-swing*.5;x.legR.rotation.x=swing*.5}else{x.armL.rotation.z=x.armR.rotation.z=x.legL.rotation.x=x.legR.rotation.x=0}
x.kn=Math.min(100,x.kn+dt*.018);if(x.build>0){x.build-=dt;if(x.build<=0){x.build=0;x.state='осматривается';document.querySelector('#build').style.display='none';log(`🏕️ ${x.name} закончил первое убежище`);}}
}
function dayNight(){const now=new Date();const h=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;const sunH=(h-6)/12*Math.PI;const daylight=Math.max(0,Math.sin(sunH));const sky=new THREE.Color().lerpColors(new THREE.Color(0x07101e),new THREE.Color(0x79aebc),Math.min(1,daylight*.9+.08));scene.background.copy(sky);scene.fog.color.copy(sky);sun.position.set(Math.cos(sunH)*45,Math.max(4,Math.sin(sunH)*55),15);sun.intensity=.35+daylight*2.3;hemi.intensity=.35+daylight*1.2;glow.intensity=.7+(1-daylight)*3;flame.scale.y=.85+Math.sin(Date.now()/110)*.12;clockEl.textContent=now.toLocaleTimeString();document.querySelector('#day').textContent='DAY '+Math.floor((Date.now()/86400000)%999+1)}
function cam(){let t=follow?follow.q.position:new THREE.Vector3(0,1,2);camera.position.lerp(new THREE.Vector3(t.x+Math.sin(yaw)*rad,7+Math.sin(pitch)*8,t.z+Math.cos(yaw)*rad),.07);camera.lookAt(t.x,1.2,t.z)}
function project(x){let v=x.q.position.clone();v.y=3;v.project(camera);let X=(v.x*.5+.5)*innerWidth,Y=(-v.y*.5+.5)*innerHeight;x.ne.style.left=X+'px';x.ne.style.top=Y+'px';x.be.style.left=X+'px';x.be.style.top=(Y-18)+'px';x.be.style.display=x.be.textContent?'block':'none'}
let pts=new Map(),lx=0,ly=0,pd=0,pr=rad;const distance=()=>{let p=[...pts.values()];return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};renderer.domElement.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){lx=e.clientX;ly=e.clientY}else{pd=distance();pr=rad}});renderer.domElement.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){yaw-=(e.clientX-lx)*.008;pitch=Math.max(.15,Math.min(1.3,pitch-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;follow=null}else if(pd)rad=Math.max(12,Math.min(65,pr*pd/Math.max(1,distance())))},{passive:false});['pointerup','pointercancel'].forEach(k=>renderer.domElement.addEventListener(k,e=>pts.delete(e.pointerId)));
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶️ Продолжить':'⏸ Пауза'};document.querySelector('#followA').onclick=()=>{follow=a;auto=false};document.querySelector('#followB').onclick=()=>{follow=b;auto=false};document.querySelector('#free').onclick=()=>{follow=null;auto=false};document.querySelector('#auto').onclick=()=>{auto=!auto;follow=null};
let last=performance.now(),uiLast=0,autoT=0,autoAgent=a;function loop(now){requestAnimationFrame(loop);let dt=Math.min(.1,(now-last)/1000);last=now;dayNight();if(!paused){A.forEach(x=>update(x,dt));if(a.q.position.distanceTo(b.q.position)<2.8)talk(a,b)}if(auto&&!follow){autoT-=dt;if(autoT<=0){autoAgent=A[Math.floor(Math.random()*A.length)];autoT=8+Math.random()*10}let p=autoAgent.q.position;let d=Math.atan2(p.x-camera.position.x,p.z-camera.position.z);yaw+=Math.atan2(Math.sin(d-yaw),Math.cos(d-yaw))*.018}cam();A.forEach(project);if(now-uiLast>600){document.querySelector('#stats').innerHTML=`<div class="stat">🕐 Реальное время: <b>${new Date().toLocaleTimeString()}</b></div><div class="stat">🤝 Связь: <b>${relation}%</b></div>`+A.map(x=>`<div class="stat"><b>${x.name}</b> · ${x.state}<br>⚡ ${Math.round(x.en)} · 🍎 ${Math.round(x.hu)} · 🧠 ${Math.round(x.kn)} · 🪵 ${x.wood} · 🪨 ${x.stone}</div>`).join('');uiLast=now}renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
log('🌱 День 1 начался. Альфа и Бета появились в новом мире.');
</script></body></html>
