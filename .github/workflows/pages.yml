name: Deploy AI Life to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Three.js CDN for Pages runtime
        run: sed -i "s#https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js#https://unpkg.com/three@0.180.0/build/three.module.js#g" js/main.js

      - name: Validate JavaScript syntax
        run: node --check js/main.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
