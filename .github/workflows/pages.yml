name: Deploy AI Life to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare self-contained Three.js runtime
        run: |
          mkdir -p js/vendor
          curl -fsSL --retry 3 --retry-delay 2 -o js/vendor/three.module.js https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js
          test -s js/vendor/three.module.js
          sed -i "s#https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js#./vendor/three.module.js#g" js/main.js
          node --check js/main.js
          cp js/main.js js/main-20260917.js
          sed -i 's#./js/main.js#./js/main-20260917.js#g' index.html
          grep -q './js/main-20260917.js' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
