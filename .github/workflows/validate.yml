name: Validate AI Life

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One-off character body update
        if: \${{ github.ref == 'refs/heads/feature/ai-character-bodies' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/main.js')
          s=p.read_text()
          if "const isOpenAI" in s:
              raise SystemExit(0)
          new = r'''function makeAgent(name,color,x,z){
  const root=new THREE.Group();
  root.position.set(x,0,z);scene.add(root);
  const isOpenAI=name==='OpenAI';
  const glow=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.14,side:THREE.BackSide});
  const shell=new THREE.MeshStandardMaterial({color:isOpenAI?0xdbe5e4:0xe6ddd2,metalness:.42,roughness:.34});
  const dark=new THREE.MeshStandardMaterial({color:isOpenAI?0x152229:0x33251f,metalness:.2,roughness:.48});
  const eyeMat=new THREE.MeshBasicMaterial({color:isOpenAI?0x63c9e8:0xe7a45e});
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.92,6,14),shell);
  body.position.y=1.18;body.castShadow=true;root.add(body);
  const chest=new THREE.Mesh(new THREE.CylinderGeometry(.34,.42,.58,10),shell);
  chest.rotation.x=Math.PI/2;chest.position.set(0,1.25,.34);chest.castShadow=true;root.add(chest);
  const core=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),new THREE.MeshBasicMaterial({color}));
  core.position.set(0,1.22,.63);root.add(core);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(1.08,20,16),glow);
  halo.position.y=1.22;root.add(halo);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.56,18,14),shell);
  head.scale.set(.92,1.0,.82);head.position.set(0,2.05,.02);head.castShadow=true;root.add(head);
  const eyeGeo=new THREE.BoxGeometry(isOpenAI?.15:.14,.18,.06);
  const eyeY=2.09;
  const eyeL=new THREE.Mesh(eyeGeo,eyeMat);eyeL.position.set(-.22,eyeY,.47);root.add(eyeL);
  const eyeR=eyeL.clone();eyeR.position.x=.22;root.add(eyeR);
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(isOpenAI?.24:.22,.045,.045),dark);
  mouth.position.set(0,1.86,.49);root.add(mouth);
  const armL=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.58,4,8),shell);armL.position.set(-.62,1.15,0);armL.rotation.z=.08;armL.castShadow=true;root.add(armL);
  const armR=armL.clone();armR.position.x=.62;armR.rotation.z=-.08;root.add(armR);
  const footL=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),dark);footL.scale.set(1,.58,1.2);footL.position.set(-.23,.34,.04);footL.castShadow=true;root.add(footL);
  const footR=footL.clone();footR.position.x=.23;root.add(footR);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.74,.018,8,48),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.4}));
  ring.rotation.x=Math.PI/2;ring.position.y=.04;root.add(ring);
  const label=document.createElement('div');label.className='agent-label';label.innerHTML=`<span class="agent-name-tag">${name}</span><span class="agent-state-tag">наблюдает</span>`;label.style.setProperty('--agent-color',`#${color.toString(16).padStart(6,'0')}`);document.body.appendChild(label);
  return{name,color,root,body,core,halo,ring,head,eyeL,eyeR,mouth,label,target:new THREE.Vector3(x,0,z),state:'observing',stateUntil:0,metrics:{survival:.74,autonomy:.52,learning:.18,exploration:.31,social:.08,decision:.63},memory:[],needs:{energy:.18,thirst:.22,curiosity:.62,social:.05,hunger:.2},abilities:[],brain:null,phase:Math.random()*10,recentTargets:[],routeHistory:[],lastRouteSignature:'',isOpenAI};
}
`;
          pattern=r"function makeAgent\(name,color,x,z\)\{.*?\n\}\nagents\.push\(makeAgent\('OpenAI'";
          ns,n=re.subn(pattern,new+"agents.push(makeAgent('OpenAI'",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('makeAgent block not found')
          old="const bob=Math.sin(now*.0024+a.phase)*.035;a.root.position.y=bob;a.core.scale.setScalar(1+Math.sin(now*.004+a.phase)*.08);a.ring.rotation.z+=dt*.35;projectLabel(a)"
          newAnim="const bob=Math.sin(now*.0024+a.phase)*.035;a.root.position.y=bob;a.core.scale.setScalar(1+Math.sin(now*.004+a.phase)*.08);const blink=Math.sin(now*.0017+a.phase*3.1)>0.985?0.045:1;a.eyeL.scale.y=blink;a.eyeR.scale.y=blink;const talking=speechBubbles.get(a.name)?.classList.contains('show');a.mouth.scale.x=talking?(1.05+Math.abs(Math.sin(now*.018+a.phase))*.5):1;a.mouth.scale.y=talking?.7:1;a.ring.rotation.z+=dt*.35;projectLabel(a)"
          if old not in ns: raise SystemExit('animation anchor not found')
          ns=ns.replace(old,newAnim,1)
          p.write_text(ns)
          PY
          node --check js/main.js
          git checkout HEAD^ -- .github/workflows/validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/main.js .github/workflows/validate.yml
          git commit -m "feat: add new AI character bodies and blinking faces"
          git push
      - name: Check required files
        run: |
          test -s index.html
          test -s css/style.css
          test -s js/main.js
      - name: Check JavaScript syntax
        run: node --check js/main.js
      - name: Test autonomous backend in test mode
        run: |
          AI_LIFE_MODE=test node server/index.js > /tmp/ai-life-backend.log 2>&1 &
          PID=$!
          trap "kill $PID" EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/api/health >/dev/null && break; sleep 0.25; done
          AI_LIFE_MODE=test node server/test.js

      - name: Ensure index is only the HTML shell
        run: |
          ! grep -q "import \\* from 'https://cdn.jsdelivr.net/npm/three" index.html
          ! grep -q "function makeAgent" index.html
